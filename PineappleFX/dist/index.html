ая здесь — для фоновых движений и медленных появлений, которые не должны притягивать взгляд."},swift:{subtitle:"Резкое замедление",description:"Рывок вперёд и жёсткое замедление на месте. Почти всё движение происходит в начале, так что интерфейс кажется мгновенным, но мягко приземляется. Отлично для меню и шторок."},"spring-tight":{subtitle:"Быстрое, собранное успокоение",description:"Быстрая, сильно затухающая пружина — один небольшой перелёт, затем покой. Затухание 26. Применяется как выражение к выбранному свойству."},"back-out":{subtitle:"Перелёт на входе",description:"Проскакивает чуть дальше цели и возвращается. Более чистый и собранный перелёт, чем у Bouncy — хорошо для приземления карточек и значков."},"back-in":{subtitle:"Замах на выходе",description:"Слегка уходит в обратную сторону перед уходом, как разбег наоборот. Лучше на выходах, где нужен небольшой замах перед тем, как слой уйдёт."},"quart-in-out":{subtitle:"Глубокая симметричная плавность",description:"Сильная симметричная плавность вход-выход — медленнее на обоих концах, чем Apple Standard, и быстрее в середине. Для длинных кинематографичных движений."},"quint-out":{subtitle:"Сильное замедление",description:"Приземляется с долгим мощным замедлением. Почти всё движение в начале, затем плавно останавливается. Для крупных появлений, которые должны ощущаться весомо."},"circ-in-out":{subtitle:"Крутая, механическая",description:"Почти вертикальный рывок через середину с мягкими концами. Читается быстро и механически — хорошо для счётчиков, шкал и технического UI."},"spring-heavy":{subtitle:"Медленный, весомый отскок",description:"Низкая медленная пружина с большими ленивыми отскоками, будто оседает что-то с настоящей массой. Затухание 6. Применяется как выражение к выбранному свойству."},"spring-snappy":{subtitle:"Быстрая и живая",description:"Быстрая пружина с парой тугих энергичных отскоков. Затухание 16. Применяется как выражение к выбранному свойству."}},text:{"hero-reveal":{subtitle:"Масштаб + размытие + прозрачность",description:"Появление всего текста: масштаб, размытие и прозрачность вместе. Мягкая посадка. Собрано на движке Range Selector."},"slide-up":{subtitle:"Позиция + прозрачность, по буквам",description:"Вертикальный въезд по буквам с затуханием. Чистый каскад Apple Standard, без отскока."},slide:{subtitle:"Въезд по буквам, словам или строкам",description:"Текст въезжает и проявляется по одному элементу за раз. Выбери, по буквам, словам или строкам, и с какой стороны."},"scale-bounce":{subtitle:"Пружинистое появление с перелётом",description:"Весь текст увеличивается на место с настоящим пружинным перелётом. Простое, хлёсткое кейноут-появление."},"color-scale":{subtitle:"Цветное появление с масштабом и размытием",description:"Текст падает из увеличенного состояния с пружиной, теряя размытие и проявляясь, в выбранном цвете."},"skew-color":{subtitle:"Наклонный въезд по буквам, цветной",description:"Буквы взлетают на место с лёгким наклоном, теряя размытие и проявляясь, в выбранном цвете, поверх мягкого масштабного отскока."},"word-stagger":{subtitle:"Пословный въезд + размытие",description:"Слова поднимаются и становятся резкими одно за другим. По рецепту Apple slide-up (Range Selector, Ramp Up)."},"letter-stagger":{subtitle:"Побуквенно: въезд + масштаб + размытие",description:"Буквы каскадом въезжают с мягким успокоением. По рецепту текст-анимации (Range Selector, Ramp Up, Ease High)."},"word-bounce":{subtitle:"Пружинный масштаб по словам",description:"Каждое слово упруго вырастает до размера с настоящим перелётом. Затухающая пружина, по словам."},burst:{subtitle:"Плавно по буквам: масштаб + смещение + размытие",description:"Буквы масштабируются, смещаются и теряют размытие с небольшим каскадом, чтобы всё слово плавно втекало от первой к последней."},typewriter:{subtitle:"Буквы появляются одна за другой",description:"Символы проявляются слева направо с постоянной скоростью и остаются. Классическое печатное появление."},"bounce-up":{subtitle:"Пружинный подъём снизу по буквам",description:"Каждая буква упруго вспрыгивает на место с затухающим отскоком. На основе позиции, живое успокоение."},"bounce-rotate":{subtitle:"Пружинный поворот по буквам",description:"Каждая буква поворотом встаёт на место с вращательной пружиной, вращаясь от своего низа."},"soft-bounce":{subtitle:"Подъём с мягким успокоением",description:"Пружинит снизу с мягким многократным отскоком. Выбери, движется ли вся строка вместе или каскадом по словам, строкам или символам."},iris:{subtitle:"Уменьшение из большого + размытие",description:"Весь текст плавно въезжает из увеличенного с размытым растворением. Гладкое, премиальное успокоение."},"number-counter":{subtitle:"Плавный отсчёт значения",description:"Считает от одного значения к другому с плавностью Apple Standard. Заменяет текст бегущим числом."},"elastic-in":{subtitle:"Пружина + масштабный хлопок по буквам",description:"Каждая буква пружинит снизу и одновременно уменьшается из увеличенной до полного размера с настоящим упругим перелётом. Bounce Up с добавленным масштабным хлопком."},scramble:{subtitle:"Расшифровка из случайных в финальные",description:"Символы начинаются случайными глифами и разрешаются слева направо в финальный текст, как расшифровка или хакерское появление. На выражении Source Text, пробелы остаются чистыми."},"fade-chars":{subtitle:"Каскад прозрачности по буквам",description:"Простейшее проявление текста: буквы проступают одна за другой, без движения. Чисто и тихо, для титров, которые должны читаться сразу."},"fade-words":{subtitle:"Каскад прозрачности по словам",description:"Слова проступают одно за другим. Спокойнее, чем по буквам, — для длинных строк и предложений."},"rise-chars":{subtitle:"Подъём + затухание по буквам",description:"Каждая буква немного поднимается снизу, проявляясь. Тот самый сдержанный вход, к которому тянешься на большинстве титров."},"drop-chars":{subtitle:"Падение + затухание по буквам",description:"Каждая буква падает сверху и проявляется. Нисходящая пара к Rise Chars."},"scale-chars":{subtitle:"Масштаб + затухание по буквам",description:"Буквы вырастают из меньшего размера, проявляясь одна за другой. Хлопок без пружины — чисто и собранно."},"spin-chars":{subtitle:"Поворот + затухание по буквам",description:"Каждая буква поворотом встаёт на место, проявляясь. Игривое проявление для коротких хлёстких титров."},"blur-words":{subtitle:"Расфокус + затухание по словам",description:"Слова становятся резкими из мягкого размытия, проявляясь одно за другим. Премиальное, киношное появление слов."}},transitions:{"pop-in":{subtitle:"Пружинное масштабное появление",description:"Слой вырастает от нуля до полного размера с приятным перелётом. Эффект «Pop» из Apple Keynote. Лучше всего для логотипов, карточек, значков."},"bounce-in":{subtitle:"Въезд с перелётом",description:"Въезжает снаружи и перелетает точку покоя, прежде чем осесть. Классическое ощущение «карточка ложится на стол» от Apple. Задай направление ползунками смещения."},"side-to-center":{subtitle:"Элементы сходятся в центре",description:"Выдели несколько слоёв — они влетают с чередующихся краёв экрана (слева, справа, слева), сходясь к центру. Для рядов заголовков, линеек логотипов и раздельных появлений. Каждый слой встаёт ровно туда, где ты его разместил; чем больше слоёв, тем богаче эффект встречи в центре."},"spin-in":{subtitle:"Поворот + масштабное появление",description:"Поворачивается на место из угла, одновременно вырастая, с затуханием прозрачности. Пружинная кривая на повороте и масштабе даёт тактильное «крутнулся и встал»."},"blur-in":{subtitle:"Из расфокуса в фокус",description:"Слой проявляется, теряя размытие от мягкого Fast Box Blur. Гладкое появление в стиле Apple, для геройских кадров или медленных интро."},"blur-out":{subtitle:"Из фокуса в расфокус",description:"Слой затухает, набирая размытие. Зеркало Blur In. Как плавный выход, когда слой должен раствориться в фоне."},"iris-close":{subtitle:"Круговое схлопывание в точку",description:"Круглая маска сжимается с полного экрана в одну точку. Классический выход «ирис» из Apple Keynote. Путь маски на выражении, без растеризации."},"fade-in":{subtitle:"Простое проявление",description:"Самый простой вход: прозрачность плавно идёт от 0 до полной на позиции курсора. Без движения, ничего лишнего — для титров и оверлеев, которые должны просто появиться."},"fade-out":{subtitle:"Простое затухание",description:"Прозрачность плавно уходит от полной к 0 на позиции курсора. Чистый выход — близнец Fade In."},"grow-in":{subtitle:"Мягкое увеличение без перелёта",description:"Вырастает от чуть меньшего размера и проявляется — вход спокойнее, чем Pop In, без отскока. Хорошо для фото и карточек."},"scale-out":{subtitle:"Сжаться и раствориться",description:"Уменьшается до нуля, одновременно затухая. Аккуратный выход для карточек, значков и иконок."},"slide-in":{subtitle:"Направленный въезд + затухание, без отскока",description:"Въезжает из смещения и оседает, с затуханием — чище и спокойнее, чем Bounce In. Направление задаётся ползунками смещения."},"slide-out":{subtitle:"Направленный выезд + затухание",description:"Выезжает к смещению, затухая. Выход-близнец Slide In."},"rise-in":{subtitle:"Подъём снизу + затухание",description:"Классический сдержанный вход: слой немного поднимается снизу, проявляясь. Ненавязчиво, отлично для списков и подписей."},"spin-out":{subtitle:"Поворот + сжатие + затухание",description:"Поворачивается, уходя, уменьшаясь и затухая — зеркальный выход к Spin In."}},glass:{"liquid-glass":{subtitle:"Настоящая преломляющая стеклянная карточка",description:"Настоящая преломляющая стеклянная карточка, которая матирует и искривляет фон за собой. Управление повторяет эффект Glass из Figma. Перетаскивай нулевой объект PineappleFX Controls, чтобы двигать или менять размер всей сборки."},"liquid-glass-pro":{subtitle:"Настоящая хроматическая дисперсия",description:"Преломляет фон трижды с чуть разными коэффициентами и собирает его по каналам — настоящая дисперсия, а не тонированное размытие. Прекомпозирует фон в «PineappleFX Glass Source», чтобы все три прохода читали одно чистое изображение; продолжай редактировать внутри этого прекомпа как обычно."}},styles:{"soft-shadow":{subtitle:"Падающая тень",description:"Чистый крупный эффект Drop Shadow низкой непрозрачности. Дистанция и мягкость создают глубину, не выглядя тяжело."},glow:{subtitle:"Внешний ореол свечения",description:"Цветной ореол по краям слоя, ТОЛЬКО снаружи альфы. Использует стиль слоя Outer Glow, так что внутренние пиксели не трогаются."},hairline:{subtitle:"Чёткая обводка 1–2 px",description:"Чистая обводка по краям слоя. Apple использует такие на разделителях и границах карточек. Цвет по умолчанию — тёмно-серый, чтобы оставаться видимой на белом."},"inner-highlight":{subtitle:"Верхний световой скос внутрь",description:"Стиль слоя Inner Shadow как источник света сверху: тонкая яркая линия по верхним краям, мягкий тёмный отступ снизу. Даёт фигурам лёгкое ощущение вдавленности."},"light-sweep":{subtitle:"Движущийся блик",description:"Добавляет эффект AE CC Light Sweep с Центром, анимированным слева за кадр вправо за кадр за длительность. Классический «блеск» из презентаций продуктов Apple."},display:{subtitle:"Крупная типографика Apple",description:"Кейноут-стиль Apple: крупный шрифт, плотный трекинг, полужирное начертание. Шрифт подбирается при применении: SF Pro Display, если установлен, иначе Inter, затем Helvetica Neue / Helvetica / Arial."},chrome:{subtitle:"Серебристый металлический градиент",description:"Применяет стиль слоя Gradient Overlay с серебристым хром-градиентом, чисто обрезанным по глифам и независимым от позиции текста. В один клик, с предустановленными цветами под металлический вид. Шрифт подбирается по-эпловски автоматически."},"liquid-color":{subtitle:"Текст, залитый перемешанными жидкими градиентами",description:"Заливает выбранный текст рассеянным полем размытых градиентных пятен, заострённых в жидкий цвет. Жми «Перемешать» для новой палитры и раскладки каждый раз. Включи Волну (A+), чтобы закрутить цвета."},anamorphic:{subtitle:"Кинематографичные синие блики",description:"Только для нативного режима: горизонтальный Glow разносит блики вбок, горизонтальный Box Blur вытягивает их в длинные полосы, а лёгкий синий Tint даёт холодный киношный флейр. Применяется аддитивно к слою, базовое изображение остаётся видимым."},tint:{subtitle:"Одноцветный вош",description:"Отображает слой в чёрный и один цвет, так что света берут оттенок, а тени остаются тёмными. Величина задаёт, насколько сильно смешивать к тонированной версии."},duotone:{subtitle:"Двухцветная карта градиента",description:"Отображает тени в один цвет, а света в другой — классический дуотон-постер. Выбери два конца и силу смешивания."},saturation:{subtitle:"Усилить или убрать цвет",description:"Сдвигает общую насыщенность: от полного ч/б на -100 до сочной и яркой на +100. Оттенок и яркость не трогает."},brightness:{subtitle:"Яркость и контраст",description:"Быстрый подъём яркости и контраста в одном эффекте — для плоского материала, которому нужна жизнь, или пересвеченных кадров, которые надо приглушить."},invert:{subtitle:"Инвертировать цвета",description:"Инвертирует цвета слоя. Величина смешивает оригинал и инвертированную версию, так что можно задать частичный «рентген»."},blur:{subtitle:"Fast Box Blur",description:"Чистое гауссоподобное размытие с повтором краевых пикселей, так что кадр не темнеет по краям. Для фонов, расфокуса и мягких подложек."},sharpen:{subtitle:"Добавить резкости",description:"Добавляет контраст по краям, возвращая детали на мягком или апскейленном материале. Не переусердствуй — хватает немного."},noise:{subtitle:"Плёночное зерно",description:"Насыпает шум на слой, разбивая плоские градиенты и добавляя плёночную фактуру. Величина задаёт плотность зерна."},mosaic:{subtitle:"Пикселизация / цензура",description:"Разбивает слой на крупные блоки — для цензуры лиц и логотипов или намеренно низкого разрешения. Больше блоков — мельче квадраты."},fill:{subtitle:"Сплошной цвет, сохраняет альфу",description:"Заливает слой одним плоским цветом, сохраняя форму и прозрачность — удобно для силуэтов, цветных блоков и быстрой перекраски. Прозрачность даёт положить поверх оригинала."},posterize:{subtitle:"Свести в полосы",description:"Сводит слой к небольшому числу тональных уровней, давая плоский шелкографический постер-вид. Меньше уровней — графичнее."}},expressions:{wiggle:{subtitle:"Дрожание любого свойства",description:"Случайное движение через встроенную функцию AE wiggle(). Добавь октавы для более высокочастотного шума сверху."},bounce:{subtitle:"Упругая интерполяция",description:"Заменяет интерполяцию между каждой парой ключей затухающей пружинной кривой. Анимация теперь перелетает и оседает внутри существующей длительности ключей. Работает поверх любого сглаживания."},"bounce-out":{subtitle:"Отскок после последнего ключа",description:"Добавляет затухающие колебания ПОСЛЕ последнего ключа. Обычная анимация идёт нетронутой, затем оседает с хвостом-отскоком. Амплитуда берётся из разницы значений последнего движения, так что хвост масштабируется с движением."},"loop-out":{subtitle:"Зацикливание ключей навсегда",description:"Зацикливает ключи после последнего. Цикл = повтор, Туда-обратно = вперёд-назад, Смещение = аддитивно, Продолжить = постоянная скорость."},"random-seed":{subtitle:"Воспроизводимый шум",description:"Рандомизированное дрожание для каждого слоя. Каждый слой получает уникальный сид из своего индекса, так что дубликаты сразу рассинхронизируются."},"sine-wave":{subtitle:"Плавное периодическое движение",description:"Чистое синусоидальное колебание. Для «дышащего» UI, парящих значков, покачивающихся объектов. В отличие от Wiggle (случайный шум), синусоида идеально периодична."},"hover-float":{subtitle:"Парение значка в стиле Apple",description:"Мягкое вертикальное покачивание с лёгким горизонтальным дрейфом. Так значки домашнего экрана Apple парят при долгом нажатии. Применяй к Позиции."},throw:{subtitle:"Начальная скорость, плавная остановка",description:"Швыряет свойство от базового значения с начальной скоростью, затем экспоненциально оседает. Ощущение «смахни и стоп» из скролл-баунса iOS. Применяй к Позиции."},breathe:{subtitle:"Мягкая пульсация масштаба",description:"Лёгкая пульсация масштаба туда-обратно, как спокойное сердцебиение или мягкое дыхание свечения. Умножает базовый масштаб на медленную синусоиду, так что работает при любом размере слоя. Применяй к Масштабу."},"auto-fade":{subtitle:"Появление и затухание по краям слоя",description:"Поднимает прозрачность на входе слоя и опускает на выходе, без ключей. Обрежь слой — и появления следуют за новыми краями автоматически. Применяй к Прозрачности."},flicker:{subtitle:"Случайный строб прозрачности",description:"Случайно роняет прозрачность, имитируя плохую лампу, голограмму или старый ТВ. Частота задаёт, как часто меняется; Минимум — самое тёмное. С сидом по слою, так что дубликаты мерцают вразнобой. Применяй к Прозрачности."},"loop-in":{subtitle:"Зацикливание ключей с начала",description:"Зацикливает ключи до первого, так что анимация уже идёт в момент появления слоя. Зеркало Loop Out."},jitter:{subtitle:"Ступенчатая цифровая тряска",description:"Wiggle, привязанный к низкой частоте кадров: прыгает жёсткими ступенями, а не скользит. С сидом по слою. Цифровое, глючное ощущение в отличие от плавного Wiggle."},smooth:{subtitle:"Сгладить существующую анимацию",description:"Усредняет свойство за короткое временное окно, убирая дрожание и резкие скачки. Повесь на дрожащее или руками поставленное свойство, чтобы успокоить его без переклю­чевания."},orbit:{subtitle:"Круговое движение",description:"Двигает слой по кругу вокруг базовой позиции. Скорость — обороты в секунду. Применяй к Позиции."},sway:{subtitle:"Маятниковый поворот",description:"Покачивает слой туда-обратно вокруг центра, как маятник — медленная синусоида на повороте. Применяй к Повороту."},blink:{subtitle:"Детерминированный строб вкл/выкл",description:"Включает и выключает прозрачность с ровной частотой — чистый регулярный строб, в отличие от случайного Flicker. Доля вкл. задаёт, сколько цикла горит. Применяй к Прозрачности."},"fade-pulse":{subtitle:"Дышащая прозрачность",description:"Мягко поднимает и опускает прозрачность по медленной синусоиде, так что слой дышит между полным значением и приглушённым уровнем. Применяй к Прозрачности."},settle:{subtitle:"Разовый затухающий wiggle",description:"Wiggle, который стартует на входе слоя и сходит на нет, так что слой встряхивается при появлении и затем замирает. Отлично для ударов и попаданий."},"time-echo":{subtitle:"Проиграть движение с задержкой",description:"Читает свойство из момента в прошлом, так что слой тянется за анимированным. Наведи на уже движущееся свойство. Применяй к любому трансформу."},cascade:{subtitle:"Раздвинуть дубликаты во времени",description:"Сдвигает анимацию каждого слоя позже на его индекс, так что стопка дубликатов одного анимированного слоя играет волной. Никаких ключей раскидывать руками. Применяй к любому трансформу."},"random-rotation":{subtitle:"Разброс угла по слоям",description:"Даёт каждому слою фиксированный случайный наклон от его индекса, так что дублированные стикеры, карточки и фото сидят под естественными разными углами. Применяй к Повороту."},pendulum:{subtitle:"Качание, которое успокаивается",description:"Качает слой вокруг центра и постепенно останавливается, как маятник, теряющий энергию. Стартует на входе слоя. Применяй к Повороту."},"scale-pop":{subtitle:"Пружиной до размера при появлении",description:"Пружиной вырастает от меньшего размера до полного при появлении, с настоящим перелётом — без ключей. Умножает базовый масштаб, так что работает при любом размере. Применяй к Масштабу."},wander:{subtitle:"Медленное плавное парение",description:"Дрейфует слой по медленной неповторяющейся траектории — глаже и спокойнее, чем Wiggle. Для живых фонов и парящих элементов. Применяй к Позиции."}},numbers:{"to-100":{subtitle:"Целое число",description:"Простой счёт до ста. Самая простая отправная точка."},"to-1k":{subtitle:"Через пробел",description:"Тысячи через пробел — обычная запись за пределами США."},"to-10k":{subtitle:"Через пробел",description:"Десять тысяч с разделителем-пробелом."},"to-100k":{subtitle:"Через пробел",description:"Сто тысяч с разделителем-пробелом."},"to-1m":{subtitle:"Через пробел",description:"Миллион, сгруппированный по три."},usd:{subtitle:"Доллар, запятая",description:"Доллары США: символ впереди, тысячи через запятую."},eur:{subtitle:"Евро, запятая",description:"Евро с символом впереди."},rub:{subtitle:"Рубль, в конце",description:"Рубли: символ следует за числом через пробел, как принято в русской типографике."},percent:{subtitle:"Проценты",description:"Процент со знаком вплотную к числу."},"two-dec":{subtitle:"Два знака",description:"Фиксированные два знака после запятой — для цен и точных показаний."},"one-dec-9":{subtitle:"Один знак",description:"Один знак после запятой, малый диапазон."},"one-dec-99":{subtitle:"Один знак",description:"Один знак после запятой, двузначный диапазон."},"one-dec-999":{subtitle:"Один знак",description:"Один знак после запятой, трёхзначный диапазон."},"to-10":{subtitle:"Малое целое",description:"Короткий счёт до десяти — для номеров шагов, оценок и небольших метрик."},"to-500":{subtitle:"Целое число",description:"Средний диапазон без разделителей."},gbp:{subtitle:"Фунт, запятая",description:"Фунты стерлингов: символ впереди, тысячи через запятую."},yen:{subtitle:"Иена, запятая",description:"Иены с символом впереди и тысячами через запятую."},fps:{subtitle:"С единицей",description:"Значение с единицей в конце, отделённой пробелом."},"percent-1":{subtitle:"Процент, один знак",description:"Процент с одним знаком после запятой, знак вплотную к числу."}},devices:{"iphone-15-pro":{description:"iPhone 15 Pro / 14 Pro. Непрерывные углы дисплея с измеренным радиусом 55pt, концентричный внешний корпус и Dynamic Island. Помести свою запись экрана в прекомп «Screen»."},"iphone-15-pro-max":{description:"iPhone 15 Pro Max / 15 Plus. Те же непрерывные углы 55pt на большем холсте 430 × 932pt."},"iphone-17-pro":{description:"iPhone 17 Pro / 16 Pro. Больший дисплей 402 × 874pt с измеренными непрерывными углами 62pt и Dynamic Island. Помести свою запись экрана в прекомп «Screen»."},"iphone-17-pro-max":{description:"iPhone 17 Pro Max / 16 Pro Max. Самый большой холст iPhone — 440 × 956pt, те же непрерывные углы 62pt и Dynamic Island."},"ipad-pro-11":{description:"iPad Pro 11 дюймов. Более круглые углы дисплея, чем у прежних поколений, без острова. Хорошо для прохождений приложений, где рамка телефона слишком узкая."}},tools:{"center-text":{subtitle:"Центр по тексту, слой по композиции",description:"Ставит центр привязки в истинный центр текста — по самим буквам, а не по боксу слоя — затем помещает слой ровно в центр композиции. Один клик вместо двух отдельных операций. Работает с одной строкой или многими, любым шрифтом, кеглем, интерлиньяжем, выключкой или масштабом слоя.",actionLabel:"Центр",requirement:"Выдели один или несколько текстовых слоёв."},"center-anchor":{subtitle:"Только привязка, текст на месте",description:"То же центрирование точки привязки, но текст не сдвигается на экране — позиция компенсируется ровно на величину сдвига привязки, с учётом масштаба и поворота слоя. Используй, когда раскладка уже верна и нужна лишь вменяемая ось для масштаба или поворота.",actionLabel:"Центр",requirement:"Выдели один или несколько текстовых слоёв."},"box-pill":{subtitle:"Полностью скруглённый, обнимает текст",description:"Кладёт полностью скруглённую капсулу за текст, по размеру текста плюс отступы. Перепечатай текст — и капсула меняет размер с ним, без перерисовки. Отступы и заливка остаются живыми на слое-фигуре.",actionLabel:"Добавить",requirement:"Выдели один или несколько текстовых слоёв."},"box-card":{subtitle:"Скруглённый прямоугольник",description:"Скруглённая карточка за текс
