# Pineapple Store — verify on every push/PR to main, deploy static site to Pages.
#
# Repo layout: the static site lives at the REPO ROOT (index.html, store.html,
# admin.html, dashboard.html, assets/, downloads/) so the custom domain
# www.pineapplestore.us.ci serves without a 404. `api/` at root is inert on
# Pages — plug an external backend via window.PFX_API_BASE.
# Backend alternative: deploy the same repo on Vercel (project pineapple-store).
#
# Optional repo variable for panel enforcement builds:
#   PFX_VERIFY_URL = https://your-api-host/api/verify-license

name: Verify + Deploy (GitHub Pages)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pre-deploy gate (pages, assets, JS, .zxp, manifest)
        run: python tools/ci_check.py

      - name: Backend handler smoke tests
        run: |
          node --input-type=module -e "
          process.env.DATA_DIR='/tmp/pfx-ci'; process.env.MINT_SECRET='7c795771be81002adee1870b7dfbc589'; process.env.TOKEN_SECRET='ci-secret-0123456789abcdef';
          const mock=(b,h)=>({method:'POST',body:b,headers:h||{}});
          const mockRes=()=>({statusCode:200,headers:{},setHeader(){},status(c){this.statusCode=c;return this},json(o){this.payload=o;return this},end(){return this}});
          const gen=(await import('./api/generate-license.js')).default;
          const ver=(await import('./api/verify-license.js')).default;
          let r=mockRes(); await gen(mock({email:'ci@t.com',machine_id:'AAAAAAAA',txn_id:'TXNCI0001'}),r);
          if(r.statusCode!==200) throw new Error('mint failed: '+JSON.stringify(r.payload));
          const key=r.payload.key;
          r=mockRes(); await ver(mock({machine_id:'AAAAAAAA',license_key:key}),r);
          if(!r.payload.ok || !r.payload.token) throw new Error('verify failed: '+JSON.stringify(r.payload));
          console.log('backend smoke OK ('+key+')');
          "

  deploy:
    if: github.event_name == 'push'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
